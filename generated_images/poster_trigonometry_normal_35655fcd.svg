<svg viewBox="0 0 960 580" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgNorm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="headerGradNorm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="brickPattern" width="20" height="12" patternUnits="userSpaceOnUse">
      <rect width="20" height="12" fill="#1e293b"/>
      <path d="M 0 0 L 20 0 M 0 12 L 20 12 M 0 6 L 20 6 M 10 0 L 10 6 M 0 6 L 0 12 M 20 6 L 20 12" stroke="#334155" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <!-- Frame -->
  <rect width="960" height="580" fill="url(#bgNorm)" rx="16" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Title Banner -->
  <rect x="0" y="0" width="960" height="60" fill="#0b1329" rx="16"/>
  <rect x="0" y="44" width="960" height="16" fill="#0b1329"/>
  <line x1="0" y1="60" x2="960" y2="60" stroke="#1e293b" stroke-width="1.5"/>

  <text x="28" y="38" fill="url(#headerGradNorm)" font-size="22" font-weight="900" font-family="'Segoe UI', system-ui, sans-serif">📐 TRIGONOMETRY : SIN, COS &amp; TAN (Real-Life Blueprint)</text>
  <rect x="745" y="16" width="185" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="837" y="34" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui" text-anchor="middle">NCERT Class 10 · Chapter 8</text>

  <!-- Left: Real Life Ladder & Wall Illustration -->
  <rect x="25" y="75" width="560" height="270" rx="12" fill="#050a14" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ground -->
  <rect x="25" y="270" width="560" height="75" fill="#0f172a"/>
  <line x1="25" y1="270" x2="585" y2="270" stroke="#475569" stroke-width="2"/>

  <!-- Brick Wall on Right -->
  <rect x="420" y="95" width="80" height="175" fill="url(#brickPattern)" stroke="#475569" stroke-width="1.5"/>
  <text x="460" y="85" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">🧱 Wall</text>

  <!-- Right Triangle: A(120, 270), B(420, 270), C(420, 105) -->
  <polygon points="120,270 420,270 420,105" fill="rgba(56, 189, 248, 0.08)"/>

  <!-- Base (Distance from Wall d = 8 m) in Green -->
  <line x1="120" y1="270" x2="420" y2="270" stroke="#10b981" stroke-width="3.5"/>
  <!-- Perpendicular (Wall Height h = 6 m) in Red -->
  <line x1="420" y1="270" x2="420" y2="105" stroke="#f43f5e" stroke-width="3.5"/>
  <!-- Ladder (Hypotenuse r = 10 m) in Cyan -->
  <line x1="120" y1="270" x2="420" y2="105" stroke="#38bdf8" stroke-width="5"/>

  <!-- Ladder Rungs -->
  <line x1="150" y1="253" x2="157" y2="253" stroke="#f8fafc" stroke-width="2"/>
  <line x1="180" y1="237" x2="187" y2="237" stroke="#f8fafc" stroke-width="2"/>
  <line x1="210" y1="220" x2="217" y2="220" stroke="#f8fafc" stroke-width="2"/>
  <line x1="240" y1="204" x2="247" y2="204" stroke="#f8fafc" stroke-width="2"/>
  <line x1="270" y1="187" x2="277" y2="187" stroke="#f8fafc" stroke-width="2"/>
  <line x1="300" y1="171" x2="307" y2="171" stroke="#f8fafc" stroke-width="2"/>
  <line x1="330" y1="154" x2="337" y2="154" stroke="#f8fafc" stroke-width="2"/>
  <line x1="360" y1="138" x2="367" y2="138" stroke="#f8fafc" stroke-width="2"/>
  <line x1="390" y1="121" x2="397" y2="121" stroke="#f8fafc" stroke-width="2"/>

  <!-- 90 deg corner box at B -->
  <path d="M 400,270 L 400,250 L 420,250" fill="none" stroke="#f43f5e" stroke-width="2"/>
  <text x="388" y="265" fill="#f43f5e" font-size="10" font-weight="bold">90°</text>

  <!-- Angle arc at A -->
  <path d="M 165,270 A 45,45 0 0,0 160,248" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <text x="175" y="262" fill="#fbbf24" font-size="14" font-weight="900">θ ≈ 37°</text>

  <!-- Labels on Triangle -->
  <rect x="180" y="165" width="165" height="24" rx="4" fill="#070d19" stroke="#38bdf8" stroke-width="1"/>
  <text x="262" y="181" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Ladder (Hypotenuse) = 10 m</text>

  <rect x="430" y="170" width="130" height="38" rx="4" fill="#070d19" stroke="#f43f5e" stroke-width="1"/>
  <text x="495" y="186" fill="#f43f5e" font-size="10.5" font-weight="bold" text-anchor="middle">Wall Height (p)</text>
  <text x="495" y="201" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">h = 6 m</text>

  <rect x="210" y="280" width="160" height="24" rx="4" fill="#070d19" stroke="#10b981" stroke-width="1"/>
  <text x="290" y="296" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">Ground Distance (b) = 8 m</text>

  <!-- Right Side Calculation Box -->
  <rect x="600" y="75" width="335" height="270" rx="12" fill="#070e1c" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="600" y="75" width="335" height="38" fill="#0d1829" rx="12"/>
  <rect x="600" y="100" width="335" height="13" fill="#0d1829"/>
  <text x="618" y="99" fill="#f8fafc" font-size="13" font-weight="bold">📐 Step-by-Step Triangle Ratios</text>

  <rect x="615" y="122" width="305" height="46" rx="6" fill="rgba(244, 63, 94, 0.08)" stroke="#f43f5e" stroke-width="1"/>
  <text x="628" y="141" fill="#f43f5e" font-size="11.5" font-weight="900">sin θ = Opposite / Hypotenuse</text>
  <text x="628" y="157" fill="#94a3b8" font-size="10.5">= 6 / 10 = <tspan fill="#f8fafc" font-weight="bold">0.600</tspan> (Wall height vs Ladder length)</text>

  <rect x="615" y="176" width="305" height="46" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="1"/>
  <text x="628" y="195" fill="#10b981" font-size="11.5" font-weight="900">cos θ = Adjacent / Hypotenuse</text>
  <text x="628" y="211" fill="#94a3b8" font-size="10.5">= 8 / 10 = <tspan fill="#f8fafc" font-weight="bold">0.800</tspan> (Distance vs Ladder length)</text>

  <rect x="615" y="230" width="305" height="46" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b" stroke-width="1"/>
  <text x="628" y="249" fill="#f59e0b" font-size="11.5" font-weight="900">tan θ = Opposite / Adjacent</text>
  <text x="628" y="265" fill="#94a3b8" font-size="10.5">= 6 / 8 = <tspan fill="#f8fafc" font-weight="bold">0.750</tspan> (Slope of the ladder)</text>

  <rect x="615" y="284" width="305" height="48" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="628" y="302" fill="#38bdf8" font-size="11" font-weight="bold">Pythagoras Triple (6, 8, 10):</text>
  <text x="628" y="320" fill="#f8fafc" font-size="11" font-family="'Consolas', monospace">10² = 6² + 8²  ⇒  100 = 36 + 64 ✓</text>

  <!-- Bottom Grid: 4 Cards -->
  <rect x="25" y="360" width="218" height="155" rx="10" fill="#0b1329" stroke="#f43f5e" stroke-width="1.2"/>
  <rect x="37" y="372" width="105" height="22" rx="4" fill="#f43f5e"/>
  <text x="89" y="387" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">1. SINE (sin θ)</text>
  <text x="37" y="415" fill="#f87171" font-size="13" font-weight="900">sin θ = p / h</text>
  <text x="37" y="434" fill="#f8fafc" font-size="11" font-weight="bold">= Wall ÷ Ladder</text>
  <line x1="37" y1="445" x2="230" y2="445" stroke="#334155" stroke-width="1"/>
  <text x="37" y="465" fill="#94a3b8" font-size="10.5">💡 <tspan fill="#f8fafc" font-weight="bold">Formula Meaning:</tspan></text>
  <text x="37" y="482" fill="#cbd5e1" font-size="10">Ladder ki tulna mein wall</text>
  <text x="37" y="497" fill="#f43f5e" font-size="10.5" font-weight="bold">par kitni unchai mili.</text>

  <rect x="260" y="360" width="218" height="155" rx="10" fill="#0b1329" stroke="#10b981" stroke-width="1.2"/>
  <rect x="272" y="372" width="115" height="22" rx="4" fill="#10b981"/>
  <text x="329" y="387" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">2. COSINE (cos θ)</text>
  <text x="272" y="415" fill="#34d399" font-size="13" font-weight="900">cos θ = b / h</text>
  <text x="272" y="434" fill="#f8fafc" font-size="11" font-weight="bold">= Ground ÷ Ladder</text>
  <line x1="272" y1="445" x2="465" y2="445" stroke="#334155" stroke-width="1"/>
  <text x="272" y="465" fill="#94a3b8" font-size="10.5">💡 <tspan fill="#f8fafc" font-weight="bold">Formula Meaning:</tspan></text>
  <text x="272" y="482" fill="#cbd5e1" font-size="10">Wall se zameen par</text>
  <text x="272" y="497" fill="#10b981" font-size="10.5" font-weight="bold">horizontal doori kitni hai.</text>

  <rect x="495" y="360" width="218" height="155" rx="10" fill="#0b1329" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="507" y="372" width="115" height="22" rx="4" fill="#f59e0b"/>
  <text x="564" y="387" fill="#0f172a" font-size="11" font-weight="900" text-anchor="middle">3. TANGENT (tan θ)</text>
  <text x="507" y="415" fill="#fbbf24" font-size="13" font-weight="900">tan θ = p / b</text>
  <text x="507" y="434" fill="#f8fafc" font-size="11" font-weight="bold">= Wall ÷ Ground</text>
  <line x1="507" y1="445" x2="700" y2="445" stroke="#334155" stroke-width="1"/>
  <text x="507" y="465" fill="#94a3b8" font-size="10.5">💡 <tspan fill="#f8fafc" font-weight="bold">Formula Meaning:</tspan></text>
  <text x="507" y="482" fill="#cbd5e1" font-size="10">Unchai aur doori ka direct</text>
  <text x="507" y="497" fill="#f59e0b" font-size="10.5" font-weight="bold">ratio ya slope darshata hai.</text>

  <rect x="730" y="360" width="205" height="155" rx="10" fill="#0b1329" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="742" y="372" width="180" height="22" rx="4" fill="#0284c7"/>
  <text x="832" y="387" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">⚡ SOH - CAH - TOA Rule</text>
  <text x="742" y="416" fill="#f43f5e" font-size="11.5" font-weight="bold">SOH : <tspan fill="#f8fafc">Sin = p / h</tspan></text>
  <text x="742" y="438" fill="#10b981" font-size="11.5" font-weight="bold">CAH : <tspan fill="#f8fafc">Cos = b / h</tspan></text>
  <text x="742" y="460" fill="#f59e0b" font-size="11.5" font-weight="bold">TOA : <tspan fill="#f8fafc">Tan = p / b</tspan></text>
  <line x1="742" y1="472" x2="920" y2="472" stroke="#334155" stroke-width="1"/>
  <text x="742" y="492" fill="#38bdf8" font-size="10" font-weight="bold">p = Perpendicular | b = Base</text>
  <text x="742" y="506" fill="#94a3b8" font-size="9.5">h = Hypotenuse (Longest side)</text>

  <!-- Bottom Strip -->
  <rect x="25" y="528" width="910" height="36" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
  <text x="40" y="551" fill="#94a3b8" font-size="11">💡 <tspan fill="#38bdf8" font-weight="bold">Golden Rule:</tspan> Right triangle mein $90^\circ$ ke saamne wali side hamesha Hypotenuse hoti hai, aur angle $	heta$ ke saamne wali side Perpendicular hoti hai.</text>
</svg>